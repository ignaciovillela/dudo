services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dudo
      POSTGRES_PASSWORD: dudo
    volumes:
      - dudo-db:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - db
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: dudo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dudo

volumes:
  dudo-db:
