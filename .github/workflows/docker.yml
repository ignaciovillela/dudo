name: Build and Deploy

on:
  push:
    branches:
      - main
  # PRs (including Dependabot's) only run the tests; build and deploy are push-only.
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  # Tests first: a broken build never reaches production.
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Python syntax
        run: python -m compileall -q main.py game

      - name: Tests
        run: python -m pytest

      - name: Frontend syntax
        run: |
          for f in static/app.js static/tutorial.js; do
            node -e "new Function(require('fs').readFileSync('$f','utf8'))" || exit 1
          done

  docker:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    outputs:
      service: ${{ steps.deploy.outputs.service }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define deployment
        id: deploy
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "service=dudo" >> $GITHUB_OUTPUT
          fi

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.deploy.outputs.tag }}
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  deploy:
    needs: docker
    runs-on: [self-hosted, docker]

    steps:
      # Login as the runner user so deploy-compose can pull the private image.
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy container
        run: deploy-compose games ${{ needs.docker.outputs.service }}